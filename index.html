<title>Francis Wang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

  :root {

    --bg-2: #F4F6F9;
    --side: #1B2742;
    --side-2: #243352;
    --side-fg: #EEF1F7;
    --side-muted: #9BA7BE;
    --side-line: #34445F;
    --ink: #16202E;
    --ink-2: #3E4A5C;
    --muted: #6B7686;
    --line: #DDE2EA;
    --accent: #A51D30;
    --accent-ink: #8A1527;
    --accent-soft: #F8E7EA;
    --font-body: "Lato", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F141B; --bg-2: #171E29; --side: #0A0F17; --side-2: #131B27; --side-fg: #EEF1F7; --side-muted: #8E9AB0; --side-line: #27324A;
      --ink: #E8ECF2; --ink-2: #C3CAD5; --muted: #8E99A6; --line: #2A3441;
      --accent: #E8556A; --accent-ink: #F07A8A; --accent-soft: #3A1B23;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F141B; --bg-2: #171E29; --side: #0A0F17; --side-2: #131B27; --side-fg: #EEF1F7; --side-muted: #8E9AB0; --side-line: #27324A;
    --ink: #E8ECF2; --ink-2: #C3CAD5; --muted: #8E99A6; --line: #2A3441;
    --accent: #E8556A; --accent-ink: #F07A8A; --accent-soft: #3A1B23;
    color-scheme: dark;

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- sidebar ---------- */
  .side { background: var(--side); color: var(--side-fg); }
  .side-in {
    padding-left: max(28px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 36px 28px;
    display: grid; gap: 22px; align-content: start;
  }
  @media (min-width: 900px) {

    .side-in { padding-right: 24px; padding-block: 44px 36px; }
  }
  .avatar { width: 128px; aspect-ratio: 1; max-width: 100%; border-radius: 16px; overflow: hidden; background: var(--side-2); border: 2px solid var(--side-line); display: grid; place-items: center; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar .mono-initials { font-weight: 900; font-size: 44px; letter-spacing: -0.03em; color: var(--accent); }
  .side h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .side .motto { color: var(--accent); font-weight: 700; margin-top: 6px; line-height: 1.45; }
  .side .aff { color: var(--side-muted); line-height: 1.5; margin-top: 8px; font-size: 15.5px; }
  .side .journey { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; color: var(--side-muted); margin-top: 10px; text-transform: uppercase; }
  .side hr { border: 0; border-top: 1px solid var(--side-line); margin: 0; }
  .side .links { display: grid; gap: 12px; font-size: 15.5px; }
  .side .links a, .side .links span { color: var(--side-fg); display: flex; align-items: center; gap: 12px; min-width: 0; }
  .side .links a:hover { color: #FFFFFF; text-decoration: underline; }
  .side .links svg { width: 16px; height: 16px; flex: none; fill: var(--side-muted); }
  .side .links .t { overflow-wrap: anywhere; }
  .side nav { display: grid; gap: 2px; }
  .side nav a { color: var(--side-muted); padding: 7px 0 7px 14px; border-left: 3px solid transparent; font-size: 16px; }
  .side nav a:hover { color: var(--side-fg); text-decoration: none; }
  .side nav a.active { color: #FFFFFF; font-weight: 700; border-left-color: var(--accent); }
  @media (max-width: 899px) {
    .side-in { grid-template-columns: 1fr; }
    .side nav { display: flex; gap: 4px 14px; flex-wrap: wrap; }
    .side nav a { border-left: 0; padding: 4px 0; border-bottom: 2px solid transparent; }
    .side nav a.active { border-bottom-color: var(--accent); }
  }

  /* ---------- main ---------- */
  .main-in {
    max-width: 1080px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px 72px;
  }
  @media (min-width: 900px) { .main-in { padding-left: 56px; padding-right: max(40px, env(safe-area-inset-right, 0px)); padding-block: 64px 88px; } }

  .eyebrow { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .zh { letter-spacing: 0.22em; color: var(--muted); font-family: var(--font-body); font-size: 13px; }
  .todo { color: var(--muted); font-style: italic; border-bottom: 1px dashed var(--muted); }

  .hero { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; }
  @media (min-width: 1000px) { .hero { grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; } }
  .hero-text { min-width: 0; }
  .hero h2.hi { font-size: clamp(40px, 6vw, 60px); font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; margin: 10px 0 18px; text-wrap: balance; }
  .hero .lead { font-size: 20px; line-height: 1.55; color: var(--ink-2); margin: 0 0 16px; max-width: 62ch; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; font-size: 16px; padding: 11px 20px; border-radius: 8px; border: 2px solid var(--ink); color: var(--ink); background: transparent; cursor: pointer; text-decoration: none; }
  .btn:hover { text-decoration: none; background: var(--bg-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .tag { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; font-size: 14px; padding: 5px 13px; border-radius: 999px; }
  .photo { width: 100%; max-width: 340px; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line); display: grid; place-items: center; justify-self: start; }
  @media (min-width: 1000px) { .photo { justify-self: end; margin-top: 8px; } }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .mono-initials { font-weight: 900; font-size: 80px; letter-spacing: -0.04em; color: var(--accent); }

  section { margin-top: 64px; scroll-margin-top: 24px; }
  .sec-head { margin-bottom: 26px; }
  .sec-head .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h2 { font-size: 28px; font-weight: 900; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .bar { height: 3px; width: 56px; background: var(--accent); margin-top: 12px; position: relative; }
  .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 1px; height: 1px; background: var(--line); z-index: -1; }
  .rule { border-top: 1px solid var(--line); margin-top: -2px; }
  h3 { font-size: 18px; font-weight: 700; margin: 0; line-height: 1.3; }
  p { margin: 0 0 14px; }
  .prose { max-width: 72ch; }
  .prose p { font-size: 17px; }

  /* news */
  .news { display: grid; gap: 12px; max-width: 76ch; }
  .news .item { display: grid; grid-template-columns: 1fr; gap: 2px 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  @media (min-width: 640px) { .news .item { grid-template-columns: 120px minmax(0, 1fr); } }
  .news .when { font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }

  /* timeline */
  .tl-row { display: grid; grid-template-columns: 1fr; gap: 4px 24px; }
  .tl-date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; }
  .tl-body { min-width: 0; padding-bottom: 26px; }
  .tl-body .company { font-weight: 900; font-size: 18.5px; line-height: 1.25; }
  .tl-body .role { color: var(--ink-2); margin-top: 2px; }

  .tl-body .note { margin-top: 8px; max-width: 62ch; color: var(--ink-2); }

  }
  .founded { margin-top: 6px; padding-top: 22px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
  .founded-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 760px) { .founded-grid { grid-template-columns: 1fr 1fr; } }
  .fcard { min-width: 0; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; align-content: start; }
  .fpics { display: grid; gap: 3px; background: var(--line); }
  .fpics.n2 { grid-template-columns: 1fr 1fr; }
  .fpics img { width: 100%; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
  .fbody { padding: 16px 20px 18px; display: grid; gap: 4px; }
  .founded .what { font-weight: 900; font-size: 18px; }
  .founded .how { color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em; }
  .fdesc { margin: 6px 0 0; color: var(--ink-2); font-size: 15.5px; }

  /* projects */
  .projects { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 760px) { .projects { grid-template-columns: 1fr 1fr; } }
  .card { min-width: 0; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 10px; align-content: start; }

  .edu-main { min-width: 0; display: grid; gap: 6px; }
  .edu-head { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .edu-logo { width: 52px; height: 52px; flex: none; object-fit: contain; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); padding: 4px; }
  .edu-note { margin: 2px 0 0; color: var(--ink-2); font-size: 15.5px; max-width: 70ch; }

  .tl-body .bullets { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; max-width: 64ch; color: var(--ink-2); font-size: 15.5px; }
  .tl-body .bullets li { position: relative; padding-left: 16px; }
  .tl-body .bullets li::before { content: ""; position: absolute; left: 0; top: 0.65em; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

  /* skills */
  .skills { display: grid; gap: 16px; }
  .skill { display: grid; grid-template-columns: 1fr; gap: 6px 20px; }
  @media (min-width: 640px) { .skill { grid-template-columns: 190px minmax(0, 1fr); } }

  .skill .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill .items span { background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14.5px; }

  /* pursuits */
  .pursuits { display: grid; grid-template-columns: 1fr; gap: 36px 40px; }
  @media (min-width: 700px) { .pursuits { grid-template-columns: 1fr 1fr; } }
  .pursuit { min-width: 0; display: grid; gap: 8px; align-content: start; }
  .pursuit .eyebrow { display: flex; gap: 12px; align-items: baseline; }
  .pursuit .eyebrow .zh { color: var(--accent-ink); font-size: 15px; }
  .pursuit .pic { width: 100%; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); margin-bottom: 4px; }
  .pursuit h3 { font-size: 21px; font-weight: 900; }
  .pursuit .ptag { font-style: italic; color: var(--ink-2); margin: 0; }
  .pursuit ul { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .pursuit li { position: relative; padding-left: 18px; }
  .pursuit li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }

  footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>

<script>
(function () {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // 方括号整段 → 待填写样式；否则转义
  const txt = (s) => {
    const v = String(s ?? "").trim();
    if (!v) return "";
    return /^\[.*\]$/.test(v) ? `<span class="todo">${esc(v.slice(1, -1))}</span>` : esc(v);
  };
  // 段落：支持 [文字](网址)、**加粗**、以及方括号待填项
  const md = (s) => {
    let v = esc(String(s ?? "").trim());
    v = v.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    v = v.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    v = v.replace(/\[([^\]]+)\](?!\()/g, '<span class="todo">$1</span>');
    return v;
  };
  const $ = (id) => document.getElementById(id);
  const initials = (DATA.name || "").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  const img = (src, alt, cls) => src ? `<img class="${cls || ""}" src="${esc(src)}" alt="${esc(alt)}">` : "";

  const ICON = {
    mail: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 3h14v10H1z M2 4v.4l6 4 6-4V4z M2 5.6V12h12V5.6l-6 4z"/></svg>',
    in:   '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h12v12H2z M4.5 6.5h1.6v5H4.5z M5.3 4.2a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9z M7.3 6.5h1.5v.7c.3-.5.9-.8 1.6-.8 1.5 0 1.9.9 1.9 2.2v2.9h-1.6V9c0-.7-.1-1.3-.8-1.3-.8 0-1 .5-1 1.3v2.5H7.3z" fill-rule="evenodd"/></svg>',
    doc:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1h7l3 3v11H3z M9 2v3h3z M5 7h6v1H5z M5 9h6v1H5z M5 11h4v1H5z" fill-rule="evenodd"/></svg>',
    pin:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a4.5 4.5 0 0 0-4.5 4.5C3.5 9 8 15 8 15s4.5-6 4.5-9.5A4.5 4.5 0 0 0 8 1zm0 6.3a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6z"/></svg>',
  };

  // ---- sidebar ----
  $("avatar").innerHTML = DATA.avatar ? img(DATA.avatar, DATA.name) : `<span class="mono-initials">${esc(initials)}</span>`;
  $("side-name").textContent = DATA.name;
  document.title = DATA.name;
  $("motto").innerHTML = (Array.isArray(DATA.motto) ? DATA.motto : [DATA.motto]).filter(Boolean).map(txt).join("<br>");
  $("aff").innerHTML = (DATA.affiliations || []).filter(Boolean).map(txt).join("<br>");
  $("journey").innerHTML = txt(DATA.journey);
  const sl = [];
  if (DATA.email) sl.push(`<span>${ICON.mail}<span class="t" id="email-text">${esc(DATA.email)}</span></span>`);
  if (DATA.linkedin) sl.push(`<a href="${esc(DATA.linkedin)}" target="_blank" rel="noopener">${ICON.in}<span class="t">LinkedIn</span></a>`);
  if (DATA.cv) sl.push(`<a href="${esc(DATA.cv)}" target="_blank" rel="noopener">${ICON.doc}<span class="t">CV</span></a>`);
  if (DATA.location) sl.push(`<span>${ICON.pin}<span class="t">${txt(DATA.location)}</span></span>`);
  $("side-links").innerHTML = sl.join("");

  // ---- hero ----
  $("eyebrow").innerHTML = md(DATA.eyebrow);
  $("hi").textContent = `Hi, I'm ${DATA.firstName || DATA.name}`;
  $("lead").innerHTML = (DATA.lead || []).map((p) => `<p class="lead">${md(p)}</p>`).join("");
  const btns = [];
  if (DATA.email) btns.push(`<button class="btn primary" type="button" id="email-btn">${ICON.mail}Email me</button>`);
  if (DATA.cv) btns.push(`<a class="btn" href="${esc(DATA.cv)}" target="_blank" rel="noopener">${ICON.doc}CV</a>`);
  if (DATA.linkedin) btns.push(`<a class="btn" href="${esc(DATA.linkedin)}" target="_blank" rel="noopener">${ICON.in}LinkedIn</a>`);

  $("photo").innerHTML = DATA.photo ? img(DATA.photo, DATA.name) : `<span class="mono-initials">${esc(initials)}</span>`;

  // 邮件按钮：复制地址（mailto 在很多环境里不可靠）
  const toast = $("toast");
  const showToast = (m) => { toast.textContent = m; toast.classList.add("show"); clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.classList.remove("show"), 1800); };
  const eb = $("email-btn");
  if (eb) eb.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(DATA.email); showToast(`Copied ${DATA.email}`); }
    catch (e) {
      const el = $("email-text");
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      showToast(DATA.email);
    }
  });

  // ---- bio / news ----
  $("bio-body").innerHTML = (DATA.bio || []).map((p) => `<p>${md(p)}</p>`).join("");
  $("news-body").innerHTML = (DATA.news || []).map((n) => `<div class="item"><div class="when">${md(n.when)}</div><div>${md(n.text)}</div></div>`).join("");

  // ---- experience ----
  $("tl").innerHTML = (DATA.experience || []).map((e) => `
    <div class="tl-row">
      <div class="tl-date">${txt(e.dates)}</div>
      <div class="tl-body">
        <div class="company">${txt(e.company)}</div>
        <div class="role">${txt(e.role)}</div>
        ${e.place ? `<div class="place">${txt(e.place)}</div>` : ""}
        ${e.note ? `<p class="note">${md(e.note)}</p>` : ""}
        ${(e.bullets || []).filter(Boolean).length ? `<ul class="bullets">${e.bullets.filter(Boolean).map((b) => `<li>${md(b)}</li>`).join("")}</ul>` : ""}
      </div>
    </div>`).join("");
  const founded = (DATA.founded || []).filter((f) => f.what);
  $("founded").hidden = founded.length === 0;
  $("founded").innerHTML = `<div class="eyebrow">Founded</div><div class="founded-grid">` + founded.map((f) => {
    const imgs = (f.images || []).filter(Boolean);
    return `
    <article class="fcard">
      ${imgs.length ? `<div class="fpics n${imgs.length}">${imgs.map((s) => `<img src="${esc(s)}" alt="${esc(f.what)}">`).join("")}</div>` : ""}
      <div class="fbody">
        <div class="what">${txt(f.what)}</div>
        <div class="how">${txt(f.how)}${f.when ? ` · ${txt(f.when)}` : ""}</div>
        ${f.desc ? `<p class="fdesc">${md(f.desc)}</p>` : ""}
      </div>
    </article>`;
  }).join("") + `</div>`;

  // ---- projects ----
  $("proj").innerHTML = (DATA.projects || []).map((p) => {
    const links = (p.links || []).filter((l) => l.url).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
    return `
    <article class="card">
      <div class="ptitle">${md(p.title)}</div>
      ${p.context ? `<div class="pctx">${md(p.context)}</div>` : ""}
      <p class="pdesc">${md(p.desc)}</p>
      ${(p.tags || []).length ? `<div class="ptags">${p.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
      ${links ? `<div class="plinks">${links}</div>` : ""}
    </article>`;
  }).join("");

  // ---- education / certs ----
  $("edu").innerHTML = (DATA.education || []).map((d) => {
    const cw = (d.coursework || []).filter(Boolean), ac = (d.activities || []).filter(Boolean);
    const right = [d.when ? txt(d.when) : "", d.gpa ? `GPA ${esc(d.gpa)}` : ""].filter(Boolean).join("<br>");
    return `
    <div class="row-item edu">
      <div class="edu-main">
        <div class="edu-head">
          ${d.logo ? `<img class="edu-logo" src="${esc(d.logo)}" alt="">` : ""}
          <div><div class="name">${txt(d.school)}</div><div class="sub">${txt(d.degree)}</div></div>
        </div>
        ${d.note ? `<p class="edu-note">${md(d.note)}</p>` : ""}
        ${cw.length ? `<div class="edu-line"><span class="k">Coursework</span><span>${cw.map(md).join(" · ")}</span></div>` : ""}
        ${ac.length ? `<div class="edu-line"><span class="k">Activities</span><span>${ac.map(md).join(" · ")}</span></div>` : ""}
      </div>
      <div class="when">${right}</div>
    </div>`;
  }).join("");
  $("certs").innerHTML = (DATA.certifications || []).map((c) => `
    <div class="row-item">
      <div><div class="name">${txt(c.name)}</div>${c.issuer ? `<div class="sub">${txt(c.issuer)}</div>` : ""}</div>
      <div class="status">${txt(c.status)}</div>
    </div>`).join("");

  // ---- skills ----
  $("skills-body").innerHTML = (DATA.skills || []).map((s) => `
    <div class="skill"><div class="label">${txt(s.label)}</div><div class="items">${(s.items || []).map((i) => `<span>${txt(i)}</span>`).join("")}</div></div>`).join("");

  // ---- pursuits ----

    <article class="pursuit">
      <div class="eyebrow"><span class="zh">${txt(p.zh)}</span><span>${esc(p.title)}</span></div>

      <h3>${txt(p.title)}</h3>
      ${p.tagline ? `<p class="ptag">${md(p.tagline)}</p>` : ""}
      <ul>${(p.highlights || []).filter(Boolean).map((h) => `<li>${md(h)}</li>`).join("")}</ul>
    </article>`).join("");

  // ---- footer ----
  $("foot-name").textContent = DATA.name;
  $("foot-updated").textContent = DATA.updated ? `Updated ${DATA.updated}` : "";

  // ---- nav scroll-spy ----
  const links = Array.from(document.querySelectorAll("#nav a"));
  const byId = Object.fromEntries(links.map((a) => [a.getAttribute("href").slice(1), a]));
  const setActive = (id) => links.forEach((a) => a.classList.toggle("active", a === byId[id]));
  if ("IntersectionObserver" in window) {
    const seen = new Map();
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => seen.set(en.target.id, en.isIntersecting ? en.boundingClientRect.top : Infinity));
      let best = null, top = Infinity;
      seen.forEach((t, id) => { if (t < top) { top = t; best = id; } });
      if (best) setActive(best);
    }, { rootMargin: "-20% 0px -65% 0px", threshold: 0 });
    Object.keys(byId).forEach((id) => { const s = document.getElementById(id); if (s) io.observe(s); });
  }
  setActive("bio");
})();
</script>

</body>
</html>
